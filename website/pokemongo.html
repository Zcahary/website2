  <!-- Live Clock -->
  <div id="clock"></div>

  <script>
    function updateClock() {
      const now = new Date();
      const options = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      };

      document.getElementById("clock").innerText =
        now.toLocaleDateString(undefined, options) +
        " • " +
        now.toLocaleTimeString();
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
