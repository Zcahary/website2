  <!-- Slideshow Script -->
  <script>
    const slides = document.querySelectorAll('#slideshow img');
    let remainingIndexes = Array.from(Array(slides.length).keys());
    let currentIndex = 0;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    remainingIndexes = shuffle(remainingIndexes);

    function showNextImage() {
      slides[currentIndex].classList.remove('active');
      let nextIndex = remainingIndexes.shift();
      if (remainingIndexes.length === 0) {
        remainingIndexes = Array.from(Array(slides.length).keys()).filter(i => i !== nextIndex);
        remainingIndexes = shuffle(remainingIndexes);
      }
      slides[nextIndex].classList.add('active');
      currentIndex = nextIndex;
    }

    setInterval(showNextImage, 2000); // switch every 2 seconds
  </script>

  <!-- Clock Script -->
  <script>
    function updateClock() {
      const now = new Date();

      const options = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      };

      const date = now.toLocaleDateString(undefined, options);
      const time = now.toLocaleTimeString();

      document.getElementById("clock").innerText = `${date} • ${time}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
